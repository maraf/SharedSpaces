<!DOCTYPE html>
<script>
  // GitHub Pages SPA redirect: encode the current path into a query parameter
  // so index.html can restore it via history.replaceState before the app boots.
  var p = window.location.pathname;
  var s = window.location.search;
  var h = window.location.hash;
  window.location.replace(
    '/index.html?ghpath=' + encodeURIComponent(p) +
    (s ? '&ghsearch=' + encodeURIComponent(s) : '') +
    (h ? '&ghhash=' + encodeURIComponent(h) : '')
  );
</script>
