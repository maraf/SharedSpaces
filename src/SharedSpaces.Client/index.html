<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="api-base-url" content="/" />
    <title>SharedSpaces</title>
  </head>
  <body>
    <script>
      // GitHub Pages SPA support: restore the original URL that 404.html redirected here with.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var ghpath = params.get('ghpath');
        if (ghpath) {
          var search = params.get('ghsearch') || '';
          var hash = params.get('ghhash') || '';
          history.replaceState({}, '', ghpath + search + hash);
        }
      })();
    </script>
    <app-shell></app-shell>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
