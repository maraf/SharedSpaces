name: Regenerate Screenshots

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to regenerate screenshots for'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate:
    name: Regenerate screenshots for PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SharedSpaces.Client
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PR branch
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout ${{ inputs.pr_number }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/SharedSpaces.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run screenshot tests
        run: npx playwright test --project=screenshots

      - name: Commit and push updated screenshots
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain docs/screenshots/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots/
            git commit -m "chore(client): regenerate screenshots"
            git push
          else
            echo "Screenshots are already up to date."
          fi
