name: Screenshots

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Verify screenshots are up to date
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/SharedSpaces.Client
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/SharedSpaces.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run screenshot tests
        run: npx playwright test

      - name: Verify no uncommitted screenshot changes
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain docs/screenshots/)" ]; then
            echo "::error::Screenshots are out of date. Please run 'npx playwright test' locally and commit the updated screenshots."
            echo ""
            echo "Changed files:"
            git status --porcelain docs/screenshots/
            echo ""
            git diff --stat docs/screenshots/
            exit 1
          fi
